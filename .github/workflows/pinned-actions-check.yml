name: Pinned Actions Check

# Supply-chain guard: every third-party `uses:` must reference an immutable
# commit SHA, so a re-pointed tag on a compromised action cannot be pulled
# into a run. Fails the PR when a workflow introduces a mutable ref.

# Deliberately unfiltered. A `paths:` filter here looked like a free saving --
# the check only has anything to say when a workflow changes -- but a check that
# skips is a check that never reports, and a required status check that never
# reports blocks the PR forever. That is not hypothetical: it deadlocked the
# changesets "Version Packages" PR, which touches only .changeset/, CHANGELOG.md,
# and package.json. The job is a few seconds; being required on every PR is worth
# more than skipping it on most of them.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-actions-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinact:
    name: pinact run --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinact
        env:
          PINACT_VERSION: v4.1.1
          PINACT_CHECKSUM: d1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841
        run: |
          set -euo pipefail
          curl -fsSL -o pinact.tar.gz \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_CHECKSUM}  pinact.tar.gz" | sha256sum -c -
          tar -xzf pinact.tar.gz pinact
          sudo install -m 0755 pinact /usr/local/bin/pinact

      - name: Verify every `uses:` is pinned to a full commit SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check
