name: Release

# Changesets-driven release. Two distinct outcomes from the same workflow, decided
# by whether any changeset files are pending in .changeset/:
#
#   pending changesets  -> open/update the "Version Packages" PR (no publish)
#   none pending        -> run `changeset publish` (the version PR just merged)
#
# So nothing reaches npm without a merged PR, which is what makes this compatible
# with branch protection: this workflow never pushes to main. It pushes the
# `changeset-release/main` branch and opens a PR against main like any other author.
#
# Gate order is deliberate: the full battery runs BEFORE the changesets action, so
# a failure leaves no version PR and no publish. `build` runs in both paths --
# it is a gate in the version-PR path and a prerequisite in the publish path,
# because `changeset publish` packs dist/ as-is and never builds for you.

on:
  push:
    branches: [main]

permissions:
  contents: write # push the changeset-release/main branch, create tags
  pull-requests: write # open and update the Version Packages PR
  id-token: write # OIDC -> npm trusted publishing + provenance attestation

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # pinned to package.json#packageManager

      # `changeset publish` shells out to the *npm* CLI, never to bun -- its
      # publish-tool detection allowlists only npm/pnpm/yarn and falls through to
      # npm for everything else (verified by reading getPublishTool in the pinned
      # @changesets/cli 3.0.1). That is load-bearing here rather than incidental:
      # bun publish has no --provenance support at all (oven-sh/bun#15601) and
      # does not refuse to publish when provenance was requested and cannot be
      # honoured (oven-sh/bun#18611), so a bun publish path would silently drop
      # the attestation. Deliberately no `registry-url:` -- setting it makes
      # setup-node write an .npmrc with an `${NODE_AUTH_TOKEN}` placeholder, and
      # an empty placeholder defeats OIDC token exchange. npm defaults to
      # registry.npmjs.org unaided.
      - name: Set up Node for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # npm's trusted publishing (OIDC) landed in 11.5.1. There is no token
      # fallback configured on this repo any more, so an older npm does not
      # degrade -- it fails to authenticate at all, and it does so deep inside
      # `changeset publish` where the error is about credentials rather than
      # about the toolchain. Fail here instead, where the message is the cause.
      - name: Assert npm supports trusted publishing
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          REQUIRED=11.5.1
          if [[ "$(printf '%s\n%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -1)" != "$REQUIRED" ]]; then
            echo "::error::npm $NPM_VERSION predates trusted publishing (needs >= $REQUIRED)." \
              "Bump the node-version above until its bundled npm clears that floor."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ---------- gate battery (all must pass before a version PR is opened or
      # anything is published) ----------

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Assert generated client
        run: bun run assert:generated

      - name: Build
        run: bun run build

      - name: Verify the packaged artifact
        run: bun run verify:package

      # ---------- version PR, or publish ----------

      - name: Create Version Packages PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # Consumed by the action itself AND by `changeset version`: the
          # @changesets/changelog-github generator resolves each changeset to its
          # PR and author through the GitHub API, and throws without a token
          # rather than silently degrading to a bare summary line.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
