name: Release

# Changesets-driven release, split across four jobs so that OIDC minting is
# scoped to the one step that publishes.
#
#   gate     -- the full battery. Everything downstream `needs:` it, so a red
#               gate leaves no version PR and nothing published.
#   select   -- asks changesets what this push means: are there pending
#               changesets (-> version) or was the version PR just merged
#               (-> publish)? No permissions at all.
#   version  -- opens/updates the "Version Packages" PR. contents+PR write.
#   publish  -- runs `changeset publish`. The ONLY job holding id-token: write.
#
# The split is the point. A single job would have to hold `id-token: write` for
# its whole lifetime -- including `bun install`, the test run and every
# third-party action in between -- and any of those could mint an npm-scoped
# OIDC token. changesets/action's own README recommends the sub-actions for
# exactly this reason when trusted publishing is in use.
#
# Nothing here pushes to main, which is what makes it compatible with branch
# protection: the version job pushes the `changeset-release/main` branch and
# opens a PR like any other author, and merging that PR is what publishes.

on:
  push:
    branches: [main]

# Floor for every job; each one widens only what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13" # pinned to package.json#packageManager

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Assert generated client
        run: bun run assert:generated

      # A gate here and a prerequisite in the publish job -- `changeset publish`
      # packs dist/ as-is and never builds for you. Jobs do not share a
      # filesystem, so the publish job builds again rather than inheriting this.
      - name: Build
        run: bun run build

      - name: Verify the packaged artifact
        run: bun run verify:package

  select:
    name: Select mode
    needs: gate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # -> 'version' (changesets pending), 'publish' (version PR just merged),
      # or 'none' (nothing to do -- most pushes to main).
      - name: Select mode
        id: select
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Version Packages PR
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open and update the Version Packages PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Open or update the Version Packages PR
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: bun run changeset:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          # Read by `changeset version` itself, not just the action: the
          # @changesets/changelog-github generator resolves each changeset to
          # its PR and author through the GitHub API, and throws without a
          # token rather than silently degrading to a bare summary line.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the git tag, create the GitHub release
      id-token: write # OIDC -> npm trusted publishing + provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      # `changeset publish` shells out to the *npm* CLI, never to bun -- its
      # publish-tool detection allowlists only npm/pnpm/yarn and falls through
      # to npm for everything else (verified by reading getPublishTool in the
      # pinned @changesets/cli 3.0.1). That is load-bearing here rather than
      # incidental: bun publish has no --provenance support at all
      # (oven-sh/bun#15601) and does not refuse to publish when provenance was
      # requested and cannot be honoured (oven-sh/bun#18611), so a bun publish
      # path would silently drop the attestation. Deliberately no
      # `registry-url:` -- setting it makes setup-node write an .npmrc with an
      # `${NODE_AUTH_TOKEN}` placeholder, and an empty placeholder defeats OIDC
      # token exchange. npm defaults to registry.npmjs.org unaided.
      - name: Set up Node for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # npm's trusted publishing (OIDC) landed in 11.5.1. There is no token
      # fallback configured on this repo any more, so an older npm does not
      # degrade -- it fails to authenticate at all, and it does so deep inside
      # `changeset publish` where the error is about credentials rather than
      # about the toolchain. Fail here instead, where the message is the cause.
      - name: Assert npm supports trusted publishing
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          REQUIRED=11.5.1
          if [[ "$(printf '%s\n%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -1)" != "$REQUIRED" ]]; then
            echo "::error::npm $NPM_VERSION predates trusted publishing (needs >= $REQUIRED)." \
              "Bump the node-version above until its bundled npm clears that floor."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Not redundant with the gate job's build: jobs get fresh runners, and
      # `changeset publish` packs whatever dist/ holds at that moment.
      - name: Build
        run: bun run build

      - name: Publish
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: bun run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
