name: Spec check

# The vendored-spec freshness gate, in two independent halves:
#
#   1. `freshness` -- re-fetches spec/openapi.json at the pinned SHA (spec/PIN)
#      from the private sibylline-advisory/sumvin-api repo and byte-compares
#      it against the committed file. Requires cross-repo read access, which
#      this workflow does not silently degrade without: see the token-presence
#      step below. A drift detector that skips when its credential is missing
#      is indistinguishable from a healthy one at a glance, and can stay that
#      way for an unbounded window -- so this one fails loudly instead.
#
#   2. `regenerate-and-diff` -- modelled on sumvin-api's producer-side pattern
#      (.github/workflows/lint.yml, the "Check OpenAPI spec is up to date"
#      step): regenerate from the *committed* spec, `git diff --exit-code` the
#      output, fail with the exact command to run. Needs no network access at
#      all, so it runs unconditionally regardless of token availability.
#
#   3. `drift` -- asks the OTHER question: has upstream's spec moved since we
#      pinned it? Reads live upstream state, so its answer changes underneath
#      you; it is scheduled/manual only and is deliberately NOT a required PR
#      status check. Halves 1 and 2 both compare against immutable committed
#      content and structurally cannot notice that sumvin-api has moved on.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Drives the `drift` job only (the other two are PR/push gates and are
    # deterministic -- re-running them on a timer re-derives the same answer).
    # Nothing short of a scheduled upstream re-fetch would ever notice that
    # sumvin-api's spec moved on a week with no SDK PRs: info.version is not a
    # staleness signal (spec/SOURCE.md), so the pin is the only signal there is.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: spec:check (freshness against pinned SHA)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # scripts/lib/spec-source.ts shells out to `gh api` against the PRIVATE
      # sibylline-advisory/sumvin-api repo, which the default GITHUB_TOKEN
      # (scoped to this repo only) cannot read. A cross-repo read token is
      # required. If it is missing, FAIL -- do not let this step fall through
      # to "skipped" and report green; that is indistinguishable from a
      # healthy run at a glance, and it is the exact silent-skip failure this
      # workflow exists to avoid.
      - name: Require SUMVIN_API_READER_APP_ID
        run: |
          if [ -z "$APP_ID_PRESENT" ]; then
            echo "::error::SUMVIN_API_READER_APP_ID is not set. bun run spec:check needs a" \
              "GitHub App installation token scoped to the private" \
              "sibylline-advisory/sumvin-api repo to re-fetch spec/openapi.json at the" \
              "pinned SHA (spec/PIN) and compare it against the committed copy. This step" \
              "MUST fail when the App credentials are absent, not skip."
            exit 1
          fi
        env:
          APP_ID_PRESENT: ${{ secrets.SUMVIN_API_READER_APP_ID }}

      # Short-lived (~1h) installation token, minted fresh every run -- unlike
      # the PAT this replaced, it cannot go stale between runs and expire the
      # gate out from under a later PR (see the release.yml sibling for the
      # same action; here the App token is the only path, not a fallback, so
      # a mint failure fails the job rather than silently degrading).
      - name: Mint sumvin-api read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUMVIN_API_READER_APP_ID }}
          private-key: ${{ secrets.SUMVIN_API_READER_PRIVATE_KEY }}
          owner: sibylline-advisory
          repositories: sumvin-api
          permission-contents: read

      - name: Check spec freshness against pinned SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run spec:check

  regenerate-and-diff:
    name: bun run generate (regenerate-and-diff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate client from the vendored spec and diff
        run: |
          bun run generate

          if [[ -n $(git diff --name-only src/generated/) ]]; then
            echo "❌ src/generated/ is out of date relative to the committed spec/openapi.json."
            echo "Run 'bun run generate' locally and commit the result."
            git diff src/generated/
            exit 1
          fi

          echo "✅ src/generated/ matches spec/openapi.json"

  drift:
    name: spec:drift (upstream has moved)
    # Scheduled and manual only. This job reads LIVE upstream state, so it can
    # go red for a reason that has nothing to do with the PR in front of it --
    # which is exactly why it must never become a required status check.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same cross-repo read requirement as the freshness job, same reason to
      # fail rather than skip: a drift detector that goes green because its
      # credential is missing is worse than no drift detector at all.
      - name: Require SUMVIN_API_READER_APP_ID
        run: |
          if [ -z "$APP_ID_PRESENT" ]; then
            echo "::error::SUMVIN_API_READER_APP_ID is not set. bun run spec:drift needs a" \
              "GitHub App installation token scoped to the private" \
              "sibylline-advisory/sumvin-api repo to compare spec/PIN against the latest" \
              "upstream commit touching the spec. This step MUST fail when the App" \
              "credentials are absent, not skip."
            exit 1
          fi
        env:
          APP_ID_PRESENT: ${{ secrets.SUMVIN_API_READER_APP_ID }}

      # See the freshness job above for why this is the only path (no PAT
      # fallback) and why it is minted fresh per run.
      - name: Mint sumvin-api read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUMVIN_API_READER_APP_ID }}
          private-key: ${{ secrets.SUMVIN_API_READER_PRIVATE_KEY }}
          owner: sibylline-advisory
          repositories: sumvin-api
          permission-contents: read

      - name: Compare spec/PIN against upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run spec:drift
