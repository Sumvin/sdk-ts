[changelog]
header = """# Changelog

All notable changes to `@sumvin/sdk` will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/Sumvin/sdk-ts
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits
| filter(attribute="scope")
| sort(attribute="scope") %}
- **{{ commit.scope }}**: {{ commit.message }}
  {%- if commit.breaking %} [**BREAKING**]{% endif %}
{%- endfor -%}
{% for commit in commits %}
{%- if not commit.scope %}
- {{ commit.message }}
  {%- if commit.breaking %} [**BREAKING**]{% endif %}
{%- endif -%}
{%- endfor -%}
{% endfor %}
"""
footer = """
{%- for release in releases -%}
  {%- if release.version -%}
    {%- if release.previous.version %}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/Sumvin/sdk-ts/compare/{{ release.previous.version }}...{{ release.version }}
    {%- endif -%}
  {%- else %}
[Unreleased]: https://github.com/Sumvin/sdk-ts/compare/{{ release.previous.version }}...HEAD
  {%- endif -%}
{%- endfor %}
"""
trim = true

[git]
# Parse commits per https://www.conventionalcommits.org -- every commit this
# repo has made so far already follows `type(scope): subject`.
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^doc", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->Miscellaneous" },
    { message = "^Merge", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"

[bump]
# 0.x line, honest minor-bump-on-break (breaking changes bump
# MINOR, not major, while the major stays pinned at 0 -- that is what "honest
# minor-bump-on-break" means; breaking_always_bump_major=true would force a
# 0.x->1.0.0 jump on the first breaking change, which is the opposite of D16),
# and the very first release is 0.1.0 -- not whatever a default 0.0.0->0.1.0
# bump would compute with zero tags in the repo.
#
# initial_tag carries the "v" prefix, not just "0.1.0": observed directly by
# running `git cliff --bumped-version` against this repo before committing --
# with initial_tag = "0.1.0" it errored `Next version (0.1.0) does not match
# the tag pattern: v[0-9].*` (below). Tags and bumped-version output must
# agree with [git] tag_pattern.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
